<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Декоративная кофейная композиция">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25352c"/>
      <stop offset="0.55" stop-color="#435747"/>
      <stop offset="1" stop-color="#b99b72"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#f5ead6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f5ead6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#101710" flood-opacity=".35"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="780" cy="460" r="520" fill="url(#glow)"/>
  <g opacity=".28" filter="url(#blur)" fill="#e9d8bd">
    <circle cx="1320" cy="170" r="130"/><circle cx="240" cy="820" r="170"/>
  </g>
  <!-- botanical branches -->
  <g fill="none" stroke="#dfe4d5" stroke-opacity=".48" stroke-width="5" stroke-linecap="round">
    <path d="M170 760 C280 590 350 400 380 210"/>
    <path d="M1380 830 C1290 650 1240 470 1250 250"/>
  </g>
  <g fill="#dfe4d5" fill-opacity=".34">
    <ellipse cx="285" cy="555" rx="28" ry="70" transform="rotate(38 285 555)"/>
    <ellipse cx="330" cy="470" rx="26" ry="66" transform="rotate(-38 330 470)"/>
    <ellipse cx="352" cy="365" rx="24" ry="61" transform="rotate(42 352 365)"/>
    <ellipse cx="1245" cy="520" rx="27" ry="68" transform="rotate(-42 1245 520)"/>
    <ellipse cx="1270" cy="420" rx="25" ry="62" transform="rotate(42 1270 420)"/>
    <ellipse cx="1258" cy="320" rx="22" ry="56" transform="rotate(-38 1258 320)"/>
  </g>
  <!-- cup -->
  <g filter="url(#shadow)">
    <ellipse cx="805" cy="700" rx="280" ry="48" fill="#18221b" opacity=".38"/>
    <path d="M580 475 Q800 430 1020 475 L985 690 Q965 790 800 810 Q635 790 615 690 Z" fill="#efe6d7"/>
    <path d="M610 475 Q800 430 990 475 L975 535 Q800 575 625 535 Z" fill="#3d2418"/>
    <ellipse cx="800" cy="482" rx="190" ry="48" fill="#5a3624"/>
    <ellipse cx="800" cy="477" rx="150" ry="30" fill="#24140e" opacity=".85"/>
    <path d="M1010 545 C1140 520 1190 590 1145 665 C1115 712 1055 710 1010 680" fill="none" stroke="#efe6d7" stroke-width="48" stroke-linecap="round"/>
    <path d="M1018 550 C1110 545 1140 592 1110 642 C1092 670 1050 675 1018 655" fill="none" stroke="#435747" stroke-width="17" stroke-linecap="round"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#f5ead6" stroke-opacity=".58" stroke-width="9" stroke-linecap="round">
    <path d="M720 390 C680 340 750 300 710 245"/>
    <path d="M805 385 C770 330 845 295 810 230"/>
    <path d="M890 390 C855 340 925 300 895 255"/>
  </g>
  <rect x="58" y="58" width="1484" height="884" rx="44" fill="none" stroke="#f5ead6" stroke-opacity=".18" stroke-width="2"/>
</svg>
